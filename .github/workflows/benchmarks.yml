name: Benchmark comparison

on:
  workflow_dispatch:
    inputs:
      base:
        description: Baseline Git reference (SHA, tag, or origin/branch)
        required: true
        type: string
      candidate:
        description: Candidate Git reference (defaults to the selected workflow commit)
        type: string
      project:
        description: Repository-relative Benchmark project
        required: true
        type: string
        default: benchmarks/PacketLab.Pcap.Benchmarks/PacketLab.Pcap.Benchmarks.csproj

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Compare benchmarks
        timeout-minutes: 25
        shell: pwsh
        env:
          BENCHMARK_PROJECT: ${{ inputs.project }}
          BASE_REF: ${{ inputs.base }}
          CANDIDATE_REF: ${{ inputs.candidate || github.sha }}
        run: |
          New-Item -ItemType Directory -Force artifacts/benchmarks | Out-Null
          dotnet fsi scripts/Compare-Benchmarks.fsx $env:BENCHMARK_PROJECT $env:BASE_REF $env:CANDIDATE_REF 2>&1 |
            Tee-Object -FilePath artifacts/benchmarks/comparison.log
          exit $LASTEXITCODE

      - name: Upload report, logs and raw measurements
        if: always()
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/benchmarks/
          if-no-files-found: warn

      - name: Summarize comparison
        if: always()
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          $report = Get-Item 'artifacts/benchmarks/compare-*/report.md' -ErrorAction SilentlyContinue
          if ($report) {
            $markdown = Get-Content -LiteralPath $report.FullName -Raw
            # Relative log links belong to the downloadable report.
            ($markdown -replace '\[([^\]]+)\]\(([^)]+\.log)\)', '`$2`') >> $env:GITHUB_STEP_SUMMARY
          } else {
            'The comparison stopped before producing a report. See the job log for diagnostics.' >> $env:GITHUB_STEP_SUMMARY
          }
          if ($env:ARTIFACT_URL) {
            "`n[Download the report, logs and raw measurements]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          }
